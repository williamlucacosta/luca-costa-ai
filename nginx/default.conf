server {
  listen 80;
  server_name _;

  # one canonical host: www answers with a permanent redirect (Coolify's own www redirect is a 302)
  if ($host = www.williamlucacosta.it) { return 301 https://williamlucacosta.it$request_uri; }
  root /usr/share/nginx/html;
  absolute_redirect off;            # redirects stay relative behind Traefik (no http://...:80)
  server_tokens off;
  charset utf-8;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css text/plain text/xml application/javascript application/json application/xml image/svg+xml application/manifest+json;

  # pages of the old site that Google may still know: send them home for good
  # (no rule for /index.html: the index directive maps / to it internally, a redirect would loop)
  location = /blog.html { return 301 /; }

  # hashed build assets never change
  location /_next/static/ {
    include /etc/nginx/snippets/headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # social preview cards: Next exports them without an extension
  location ~ /opengraph-image-[^/]+$ {
    include /etc/nginx/snippets/headers.conf;
    default_type image/png;
    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri =404;
  }

  location ~* \.(?:png|jpe?g|webp|avif|gif|svg|ico|woff2?)$ {
    include /etc/nginx/snippets/headers.conf;
    add_header Cache-Control "public, max-age=2592000" always;
    try_files $uri =404;
  }

  location = /site.webmanifest {
    include /etc/nginx/snippets/headers.conf;
    default_type application/manifest+json;
    try_files $uri =404;
  }

  # HTML and the prefetch payloads: always revalidate, so a deploy shows up at once
  # trailingSlash: /work/x/ serves /work/x/index.html; /work/x gets a 301 to /work/x/ (one URL per page)
  location / {
    include /etc/nginx/snippets/headers.conf;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    index index.html;
    try_files $uri $uri/ =404;
  }

  error_page 404 /404.html;
  location = /404.html {
    include /etc/nginx/snippets/headers.conf;
    internal;
  }
}
